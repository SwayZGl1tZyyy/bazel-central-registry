name: Review BCR Pull Requests

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  review_prs:
    runs-on: ubuntu-latest

    steps:
      - name: Run upstream BCR PR Reviewer
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@957b0ac44549a70ccb951361b804d07d955aeb79
        with:
          token: ${{ github.token }}
          action-type: review_prs
