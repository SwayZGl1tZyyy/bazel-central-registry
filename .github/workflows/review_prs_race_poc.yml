name: BCR Reviewer Race PoC

on:
  push:
    branches: [main]
    paths:
      - '.poc-trigger'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Run exact pinned upstream BCR reviewer
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@957b0ac44549a70ccb951361b804d07d955aeb79
        with:
          token: ${{ github.token }}
          action-type: review_prs
