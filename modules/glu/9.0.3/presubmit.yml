matrix:
  platform:
    - ubuntu2204
  bazel:
    - SwayZGl1tZyyy/0.0.1
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    shell_commands:
      - sudo apt-get update
      - sudo apt-get install -y libgl-dev
    build_targets:
      - "@glu"
